server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Runtime config and the app shell must never be cached
  location = /env.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # SPA fallback: every client-side route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
